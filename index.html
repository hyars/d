<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2048 Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #faf8ef;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
    }
    #game-container {
      background: #bbada0;
      padding: 10px;
      border-radius: 10px;
      display: grid;
      grid-template-columns: repeat(4, 80px);
      grid-gap: 10px;
    }
    .tile {
      width: 80px;
      height: 80px;
      background: #cdc1b4;
      border-radius: 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      color: #776e65;
    }
    .tile[data-value="2"] { background: #eee4da; }
    .tile[data-value="4"] { background: #ede0c8; }
    .tile[data-value="8"] { background: #f2b179; color: #f9f6f2; }
    .tile[data-value="16"] { background: #f59563; color: #f9f6f2; }
    .tile[data-value="32"] { background: #f67c5f; color: #f9f6f2; }
    .tile[data-value="64"] { background: #f65e3b; color: #f9f6f2; }
    .tile[data-value="128"] { background: #edcf72; color: #f9f6f2; }
    .tile[data-value="256"] { background: #edcc61; color: #f9f6f2; }
    .tile[data-value="512"] { background: #edc850; color: #f9f6f2; }
    .tile[data-value="1024"] { background: #edc53f; color: #f9f6f2; }
    .tile[data-value="2048"] { background: #edc22e; color: #f9f6f2; }
    #game-over {
      margin-top: 20px;
      font-size: 28px;
      font-weight: bold;
      color: #f65e3b;
      display: none;
    }
    #bio {
      margin-top: 30px;
      text-align: center;
      font-size: 16px;
      color: #333;
    }
    #bio a {
      color: #3f729b;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="game-over">Game Over!</div>

  <!-- Instagram-style bio section -->
  <div id="bio">
    <p>🎮 Gamer • 💻 Developer • 🌍 Dreamer</p>
    <p>Follow me on Instagram: <a href="https://instagram.com/yourusername" target="_blank">@yourusername</a></p>
  </div>

  <script>
    const size = 4;
    let board = [];

    function initBoard() {
      board = Array(size).fill().map(() => Array(size).fill(0));
      addRandomTile();
      addRandomTile();
      drawBoard();
    }

    function addRandomTile() {
      let empty = [];
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (board[r][c] === 0) empty.push({r, c});
        }
      }
      if (empty.length) {
        let {r, c} = empty[Math.floor(Math.random() * empty.length)];
        board[r][c] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function drawBoard() {
      const container = document.getElementById("game-container");
      container.innerHTML = "";
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const tile = document.createElement("div");
          tile.className = "tile";
          if (board[r][c] !== 0) {
            tile.textContent = board[r][c];
            tile.setAttribute("data-value", board[r][c]);
          }
          container.appendChild(tile);
        }
      }
      if (isGameOver()) {
        document.getElementById("game-over").style.display = "block";
      }
    }

    function slide(row) {
      row = row.filter(val => val);
      for (let i = 0; i < row.length - 1; i++) {
        if (row[i] === row[i+1]) {
          row[i] *= 2;
          row[i+1] = 0;
        }
      }
      row = row.filter(val => val);
      while (row.length < size) row.push(0);
      return row;
    }

    function moveLeft() {
      let oldBoard = JSON.stringify(board);
      for (let r = 0; r < size; r++) {
        board[r] = slide(board[r]);
      }
      if (JSON.stringify(board) !== oldBoard) {
        addRandomTile();
      }
      drawBoard();
    }

    function moveRight() {
      let oldBoard = JSON.stringify(board);
      for (let r = 0; r < size; r++) {
        board[r] = slide(board[r].reverse()).reverse();
      }
      if (JSON.stringify(board) !== oldBoard) {
        addRandomTile();
      }
      drawBoard();
    }

    function moveUp() {
      let oldBoard = JSON.stringify(board);
      for (let c = 0; c < size; c++) {
        let col = [];
        for (let r = 0; r < size; r++) col.push(board[r][c]);
        col = slide(col);
        for (let r = 0; r < size; r++) board[r][c] = col[r];
      }
      if (JSON.stringify(board) !== oldBoard) {
        addRandomTile();
      }
      drawBoard();
    }

    function moveDown() {
      let oldBoard = JSON.stringify(board);
      for (let c = 0; c < size; c++) {
        let col = [];
        for (let r = 0; r < size; r++) col.push(board[r][c]);
        col = slide(col.reverse()).reverse();
        for (let r = 0; r < size; r++) board[r][c] = col[r];
      }
      if (JSON.stringify(board) !== oldBoard) {
        addRandomTile();
      }
      drawBoard();
    }

    function isGameOver() {
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (board[r][c] === 0) return false;
          if (c < size-1 && board[r][c] === board[r][c+1]) return false;
          if (r < size-1 && board[r][c] === board[r+1][c]) return false;
        }
      }
      return true;
    }

    document.addEventListener("keydown", e => {
      if (document.getElementById("game-over").style.display === "block") return;
      if (e.key === "ArrowLeft") moveLeft();
      else if (e.key === "ArrowRight") moveRight();
      else if (e.key === "ArrowUp") moveUp();
      else if (e.key === "ArrowDown") moveDown();
    });

    let startX, startY;
    document.addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });
    document.addEventListener("touchend", e => {
      if (document.getElementById("game-over").style.display === "block") return;
      let dx = e.changedTouches[0].clientX - startX;
      let dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0) moveRight(); else moveLeft();
      } else {
        if (dy > 0) moveDown(); else moveUp();
      }
    });

    initBoard();
  </script>
</body>
</html>
